name: Release distribution

# Automatic publication accepts only successful push runs on main from this repository and uses their tested SHA.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: >-
      github.repository == 'dhohner/clankers-dev' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distribution
    concurrency:
      group: release-clankers
      cancel-in-progress: false
      # Older CI completions must not displace pending releases for newer commits.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Require successful source CI for a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          passed=$(gh api --method GET "repos/$SOURCE_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SOURCE_REVISION" -f branch=main -f event=push \
            --jq '.workflow_runs | any(.status == "completed" and .conclusion == "success")')
          if [ "$passed" != true ]; then
            echo 'The selected source commit needs a successful CI push run on main.' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Check out distribution repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dhohner/clankers
          ref: main
          token: ${{ secrets.DIST_TOKEN }}
          persist-credentials: false
          path: distribution
      - name: Prepare distribution
        id: prepare
        env:
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          uv run --no-project --isolated --python 3.14 python source/tools/release/prepare.py \
            --source "$GITHUB_WORKSPACE/source" \
            --distribution "$GITHUB_WORKSPACE/distribution" \
            --revision "$SOURCE_REVISION" \
            --output "$RUNNER_TEMP/clankers-distribution" \
            --message "$RUNNER_TEMP/clankers-release-message"
      - name: Sign distribution commit
        if: steps.prepare.outputs.publish == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_SIGNING_KEY: FF0E64E593E001E1EFD4A71ED5ABAA62E29AC2F9
          RELEASE_SIGNING_EMAIL: 43063759+dhohner@users.noreply.github.com
        run: |
          bash source/tools/release/sign.sh \
            "$GITHUB_WORKSPACE/distribution" "$RUNNER_TEMP/clankers-release-message"
      - name: Publish distribution
        id: publish
        if: steps.prepare.outputs.publish == 'true'
        working-directory: distribution
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          # Git's helper shell must expand the token, keeping it out of Git's arguments.
          # shellcheck disable=SC2016
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo password="$DIST_TOKEN"; }; f' \
            push origin HEAD:main
      - name: Summarize publication
        if: always()
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          SHOULD_PUBLISH: ${{ steps.prepare.outputs.publish }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [ "$PUBLISH_OUTCOME" = success ]; then
            commit=$(git -C distribution rev-parse HEAD)
            printf '\nPublished: [%s](https://github.com/dhohner/clankers/commit/%s)\n' \
              "$commit" "$commit" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PREPARE_OUTCOME" != success ] || [ "$SHOULD_PUBLISH" = true ]; then
            printf '\nPublication failed or was cancelled; see the job logs.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
