name: Release distribution

on:
  workflow_dispatch:
    inputs:
      initial_base:
        description: "Full source commit SHA before the first release's changes (only needed without SOURCE_REVISION)"
        required: false
        type: string

concurrency:
  group: release-clankers
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.repository == 'dhohner/clankers-dev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Require successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          passed=$(gh api --method GET "repos/$SOURCE_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SOURCE_REVISION" -f branch=main -f event=push \
            --jq '.workflow_runs | any(.status == "completed" and .conclusion == "success")')
          if [ "$passed" != true ]; then
            echo 'The selected source commit needs a successful CI push run on main.' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: Test the distribution builder
        working-directory: source
        run: uv run --no-project --isolated --python 3.14 python -m unittest discover -s tools/release/tests -v
      - name: Build runtime distribution
        working-directory: source
        run: |
          uv run --no-project --isolated --python 3.14 python tools/release/build.py \
            --output "$RUNNER_TEMP/clankers-distribution"
      - name: Check out distribution repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dhohner/clankers
          ref: main
          token: ${{ secrets.DIST_TOKEN }}
          persist-credentials: false
          path: distribution
      - name: Generate release commit message
        env:
          SOURCE_REVISION: ${{ github.sha }}
          INITIAL_BASE: ${{ inputs.initial_base }}
        run: |
          uv run --no-project --isolated --python 3.14 python source/tools/release/message.py \
            --source "$GITHUB_WORKSPACE/source" \
            --distribution "$GITHUB_WORKSPACE/distribution" \
            --revision "$SOURCE_REVISION" \
            --initial-base "$INITIAL_BASE" > "$RUNNER_TEMP/clankers-release-message"
      - name: Replace tracked distribution contents
        run: |
          bash source/tools/release/replace.sh \
            "$RUNNER_TEMP/clankers-distribution" "$GITHUB_WORKSPACE/distribution"
      - name: Sign distribution commit
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_SIGNING_KEY: FF0E64E593E001E1EFD4A71ED5ABAA62E29AC2F9
          RELEASE_SIGNING_EMAIL: 43063759+dhohner@users.noreply.github.com
        run: |
          bash source/tools/release/sign.sh \
            "$GITHUB_WORKSPACE/distribution" "$RUNNER_TEMP/clankers-release-message"
      - name: Publish distribution
        working-directory: distribution
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          # Git's helper shell must expand the token, keeping it out of Git's arguments.
          # shellcheck disable=SC2016
          git -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo password="$DIST_TOKEN"; }; f' \
            push origin HEAD:main
